<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blaze Manga</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --bg: #0e0e0e;
      --surface: #161616;
      --border: #242424;
      --gold: #c9a227;
      --gold-dim: #6b551a;
      --red: #b83222;
      --white: #eeeeee;
      --muted: #666666;
      --faint: #2a2a2a;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 56px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 28px;
      gap: 20px;
    }
    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      flex-shrink: 0;
    }
    .logo-wrap img {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--gold-dim);
    }
    .logo-wrap span {
      font-family: 'Bebas Neue', cursive;
      font-size: 22px;
      letter-spacing: 3px;
      color: var(--gold);
    }
    .header-divider {
      width: 1px;
      height: 24px;
      background: var(--border);
      flex-shrink: 0;
    }
    .jump-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .jump-wrap span {
      font-family: 'Bebas Neue', cursive;
      font-size: 13px;
      letter-spacing: 2px;
      color: var(--muted);
    }
    .jump-wrap input {
      width: 56px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--white);
      font-family: 'Bebas Neue', cursive;
      font-size: 15px;
      letter-spacing: 1px;
      text-align: center;
      padding: 5px 6px;
      outline: none;
      transition: border-color 0.15s;
    }
    .jump-wrap input:focus {
      border-color: var(--gold-dim);
    }
    .jump-wrap button {
      background: var(--red);
      border: none;
      border-radius: 3px;
      color: var(--white);
      font-family: 'Bebas Neue', cursive;
      font-size: 13px;
      letter-spacing: 2px;
      padding: 6px 14px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .jump-wrap button:hover {
      opacity: 0.8;
    }
    .social-link {
      margin-left: auto;
      display: flex;
      align-items: center;
    }
    .social-link a {
      color: var(--muted);
      font-size: 24px;
      transition: color 0.15s;
      line-height: 1;
    }
    .social-link a:hover {
      color: var(--gold);
    }
    .layout {
      display: flex;
    }
    aside {
      width: 200px;
      min-width: 200px;
      position: sticky;
      top: 56px;
      height: calc(100vh - 56px);
      overflow-y: auto;
      border-right: 1px solid var(--border);
      padding: 20px 0;
      scrollbar-width: thin;
      scrollbar-color: var(--faint) transparent;
    }
    aside::-webkit-scrollbar {
      width: 3px;
    }
    aside::-webkit-scrollbar-thumb {
      background: var(--faint);
    }
    .sidebar-label {
      font-family: 'Bebas Neue', cursive;
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--muted);
      padding: 0 18px 10px;
      display: block;
    }
    .ch-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: none;
      border: none;
      border-left: 2px solid transparent;
      padding: 9px 18px;
      color: var(--muted);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .ch-link:hover {
      color: var(--white);
      background: var(--faint);
    }
    .ch-link.active {
      color: var(--gold);
      border-left-color: var(--gold);
      background: rgba(201,162,39,0.05);
    }
    .ch-link .ch-pages {
      font-size: 11px;
      color: var(--faint);
      font-weight: 400;
    }
    .ch-link.active .ch-pages {
      color: var(--gold-dim);
    }
    main {
      flex: 1;
      min-width: 0;
      padding: 40px 0 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .ch-block {
      width: 100%;
      max-width: 600px;
      margin-bottom: 56px;
      padding: 0 16px;
    }
    .ch-header {
      text-align: center;
      margin-bottom: 20px;   /* reduced padding */
    }
    .ch-title {
      font-family: 'Bebas Neue', cursive;
      font-size: 32px;
      letter-spacing: 4px;
      color: var(--white);
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dim) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-block;
      /* removed underline (border-bottom) */
    }
    .page-wrap {
      position: relative;
      width: 100%;
      margin-bottom: 24px;   /* increased spacing between pages */
      background: var(--surface);
      border-radius: 4px;
      overflow: hidden;
    }
    .page-wrap img {
      width: 100%;
      display: block;
    }
    .page-placeholder {
      width: 100%;
      aspect-ratio: 828 / 1200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--surface);
    }
    .page-placeholder svg {
      opacity: 0.15;
    }
    .page-placeholder span {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--muted);
      opacity: 0.3;
      font-family: 'Bebas Neue', cursive;
    }
    .nav-buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 32px;
      margin-bottom: 40px;
    }
    .nav-buttons button {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--white);
      font-family: 'Bebas Neue', cursive;
      font-size: 13px;
      letter-spacing: 2px;
      padding: 8px 24px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .nav-buttons button:hover:not(:disabled) {
      background: var(--gold-dim);
      border-color: var(--gold);
      color: var(--white);
    }
    .nav-buttons button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--faint);
      border-radius: 2px;
    }
    @media (max-width: 600px) {
      aside {
        display: none;
      }
      header {
        padding: 0 16px;
        gap: 12px;
      }
      .ch-block {
        padding: 0 10px;
      }
      .jump-wrap span {
        display: none;
      }
      .ch-title {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>

<header>
  <a class="logo-wrap" href="#">
    <img src="1774179327064.png" alt="Blaze Manga">
    <span>BLAZE MANGA</span>
  </a>
  <div class="header-divider"></div>
  <div class="jump-wrap">
    <span>CHAPTER</span>
    <input type="number" id="jump-input" min="1" placeholder="1" title="Jump to chapter">
    <button id="jump-button">GO</button>
  </div>
  <div class="social-link">
    <a href="https://www.instagram.com/myblaze_manga?igsh=Z24waDVtMDFkdnh6" target="_blank" rel="noopener noreferrer">
      <i class="fab fa-instagram-square"></i>
    </a>
  </div>
</header>

<div class="layout">
  <aside id="sidebar"></aside>
  <main id="main"></main>
</div>

<!-- Import manga data from external file -->
<script src="manga-data.js"></script>

<!-- All UI building logic -->
<script>
  (function() {
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof MANGA === 'undefined') {
        console.error('MANGA data not found. Make sure manga-data.js is loaded.');
        document.getElementById('main').innerHTML = '<div style="padding:80px 40px;color:#444;">ERROR: Manga data not loaded</div>';
        return;
      }

      const sidebar = document.getElementById('sidebar');
      const main = document.getElementById('main');
      const jumpInput = document.getElementById('jump-input');
      const jumpButton = document.getElementById('jump-button');

      let currentChapter = 1;

      function buildSidebar() {
        sidebar.innerHTML = '';
        const lbl = document.createElement('span');
        lbl.className = 'sidebar-label';
        lbl.textContent = 'CHAPTERS';
        sidebar.appendChild(lbl);

        MANGA.forEach((ch, idx) => {
          const chapterNum = idx + 1;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'ch-link';
          btn.id = `sb-${chapterNum}`;
          btn.innerHTML = `Chapter ${chapterNum}<span class="ch-pages">${ch.pages.length}p</span>`;
          btn.onclick = () => loadChapter(chapterNum);
          sidebar.appendChild(btn);
        });

        updateActiveSidebar();
      }

      function updateActiveSidebar() {
        document.querySelectorAll('.ch-link').forEach(btn => {
          btn.classList.remove('active');
        });
        const activeBtn = document.getElementById(`sb-${currentChapter}`);
        if (activeBtn) activeBtn.classList.add('active');
      }

      function loadChapter(chapterNum) {
        if (chapterNum < 1 || chapterNum > MANGA.length) return;

        currentChapter = chapterNum;
        updateActiveSidebar();

        const chapter = MANGA[chapterNum - 1];
        if (!chapter) return;

        const block = document.createElement('div');
        block.className = 'ch-block';
        block.id = `ch-${chapterNum}`;

        // Chapter header with reduced padding and no underline
        block.innerHTML = `
          <div class="ch-header">
            <div class="ch-title">CHAPTER ${String(chapterNum).padStart(2,'0')}</div>
          </div>
        `;

        chapter.pages.forEach((file, pageIdx) => {
          const pageNum = pageIdx + 1;
          const wrap = document.createElement('div');
          wrap.className = 'page-wrap';

          const img = document.createElement('img');
          img.onerror = function() {
            wrap.innerHTML = '';
            const placeholder = document.createElement('div');
            placeholder.className = 'page-placeholder';
            placeholder.innerHTML = `
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.2">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <path d="M3 9l4-4 4 4 4-4 4 4"/>
                <circle cx="8.5" cy="14" r="1.5"/>
              </svg>
              <span>PAGE ${pageNum}</span>
            `;
            wrap.appendChild(placeholder);
          };
          img.src = PAGES_FOLDER + file;
          img.alt = `Ch${chapterNum} P${pageNum}`;
          img.loading = 'lazy';

          wrap.appendChild(img);
          block.appendChild(wrap);
        });

        const navContainer = document.createElement('div');
        navContainer.className = 'nav-buttons';
        navContainer.id = 'nav-buttons';
        block.appendChild(navContainer);

        main.innerHTML = '';
        main.appendChild(block);

        setTimeout(() => {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }, 20);

        updateNavButtons();
      }

      function updateNavButtons() {
        const navContainer = document.getElementById('nav-buttons');
        if (!navContainer) return;

        navContainer.innerHTML = '';

        const prevBtn = document.createElement('button');
        prevBtn.textContent = '← PREVIOUS';
        prevBtn.disabled = (currentChapter === 1);
        prevBtn.onclick = () => {
          if (currentChapter > 1) loadChapter(currentChapter - 1);
        };

        const nextBtn = document.createElement('button');
        nextBtn.textContent = 'NEXT →';
        nextBtn.disabled = (currentChapter === MANGA.length);
        nextBtn.onclick = () => {
          if (currentChapter < MANGA.length) loadChapter(currentChapter + 1);
        };

        navContainer.appendChild(prevBtn);
        navContainer.appendChild(nextBtn);
      }

      function jumpChapter() {
        const val = parseInt(jumpInput.value, 10);
        if (isNaN(val) || val < 1) return;
        if (val > MANGA.length) {
          alert(`Only ${MANGA.length} chapter(s) available.`);
          return;
        }
        loadChapter(val);
      }

      function init() {
        buildSidebar();
        loadChapter(1);
        jumpButton.addEventListener('click', jumpChapter);
        jumpInput.addEventListener('keydown', e => {
          if (e.key === 'Enter') jumpChapter();
        });
      }

      init();
    });
  })();
</script>

</body>
</html>
