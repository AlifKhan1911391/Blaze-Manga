<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blaze Manga</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0e0e0e;
      --surface: #161616;
      --border: #242424;
      --gold: #c9a227;
      --gold-dim: #6b551a;
      --red: #b83222;
      --white: #eeeeee;
      --muted: #666666;
      --faint: #2a2a2a;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 56px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 28px;
      gap: 20px;
    }
    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      flex-shrink: 0;
    }
    .logo-wrap img {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--gold-dim);
    }
    .logo-wrap span {
      font-family: 'Bebas Neue', cursive;
      font-size: 22px;
      letter-spacing: 3px;
      color: var(--gold);
    }
    .header-divider {
      width: 1px;
      height: 24px;
      background: var(--border);
      flex-shrink: 0;
    }
    .jump-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .jump-wrap span {
      font-family: 'Bebas Neue', cursive;
      font-size: 13px;
      letter-spacing: 2px;
      color: var(--muted);
    }
    .jump-wrap input {
      width: 56px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--white);
      font-family: 'Bebas Neue', cursive;
      font-size: 15px;
      letter-spacing: 1px;
      text-align: center;
      padding: 5px 6px;
      outline: none;
      transition: border-color 0.15s;
    }
    .jump-wrap input:focus {
      border-color: var(--gold-dim);
    }
    .jump-wrap button {
      background: var(--red);
      border: none;
      border-radius: 3px;
      color: var(--white);
      font-family: 'Bebas Neue', cursive;
      font-size: 13px;
      letter-spacing: 2px;
      padding: 6px 14px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .jump-wrap button:hover {
      opacity: 0.8;
    }
    .layout {
      display: flex;
    }
    aside {
      width: 200px;
      min-width: 200px;
      position: sticky;
      top: 56px;
      height: calc(100vh - 56px);
      overflow-y: auto;
      border-right: 1px solid var(--border);
      padding: 20px 0;
      scrollbar-width: thin;
      scrollbar-color: var(--faint) transparent;
    }
    aside::-webkit-scrollbar {
      width: 3px;
    }
    aside::-webkit-scrollbar-thumb {
      background: var(--faint);
    }
    .sidebar-label {
      font-family: 'Bebas Neue', cursive;
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--muted);
      padding: 0 18px 10px;
      display: block;
    }
    .ch-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: none;
      border: none;
      border-left: 2px solid transparent;
      padding: 9px 18px;
      color: var(--muted);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .ch-link:hover {
      color: var(--white);
      background: var(--faint);
    }
    .ch-link.active {
      color: var(--gold);
      border-left-color: var(--gold);
      background: rgba(201,162,39,0.05);
    }
    .ch-link .ch-pages {
      font-size: 11px;
      color: var(--faint);
      font-weight: 400;
    }
    .ch-link.active .ch-pages {
      color: var(--gold-dim);
    }
    main {
      flex: 1;
      min-width: 0;
      padding: 40px 0 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .ch-block {
      width: 100%;
      max-width: 600px;
      margin-bottom: 56px;
      padding: 0 16px;
    }
    .ch-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .ch-badge {
      font-family: 'Bebas Neue', cursive;
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--red);
      background: rgba(184,50,34,0.1);
      border: 1px solid rgba(184,50,34,0.25);
      padding: 3px 10px;
      border-radius: 2px;
    }
    .ch-label {
      font-family: 'Bebas Neue', cursive;
      font-size: 18px;
      letter-spacing: 2px;
      color: var(--white);
    }
    .ch-pg-count {
      margin-left: auto;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 1px;
    }
    .page-wrap {
      position: relative;
      width: 100%;
      margin-bottom: 3px;
      background: var(--surface);
      border-radius: 2px;
      overflow: hidden;
    }
    .page-wrap img {
      width: 100%;
      display: block;
    }
    .page-num {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(14,14,14,0.75);
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      padding: 2px 7px;
      border-radius: 2px;
      backdrop-filter: blur(4px);
      pointer-events: none;
    }
    .page-placeholder {
      width: 100%;
      aspect-ratio: 828 / 1200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--surface);
    }
    .page-placeholder svg {
      opacity: 0.15;
    }
    .page-placeholder span {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--muted);
      opacity: 0.3;
      font-family: 'Bebas Neue', cursive;
    }
    #back-top {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--muted);
      font-family: 'Bebas Neue', cursive;
      font-size: 12px;
      letter-spacing: 2px;
      padding: 8px 14px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, color 0.15s;
      z-index: 99;
    }
    #back-top.show {
      opacity: 1;
      pointer-events: all;
    }
    #back-top:hover {
      color: var(--white);
    }
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--faint);
      border-radius: 2px;
    }
    @media (max-width: 600px) {
      aside {
        display: none;
      }
      header {
        padding: 0 16px;
        gap: 12px;
      }
      .ch-block {
        padding: 0 10px;
      }
      .jump-wrap span {
        display: none;
      }
    }
  </style>
</head>
<body>

<header>
  <a class="logo-wrap" href="#">
    <img src="1774179327064.png" alt="Blaze Manga">
    <span>BLAZE MANGA</span>
  </a>
  <div class="header-divider"></div>
  <div class="jump-wrap">
    <span>CHAPTER</span>
    <input type="number" id="jump-input" min="1" placeholder="1" title="Jump to chapter">
    <button id="jump-button">GO</button>
  </div>
</header>

<div class="layout">
  <aside id="sidebar"></aside>
  <main id="main"></main>
</div>

<button id="back-top" onclick="scrollTo({top:0,behavior:'smooth'})">↑ TOP</button>

<!-- Import manga data from external file -->
<script src="manga-data.js"></script>

<!-- All UI building logic -->
<script>
  (function() {
    // Wait for DOM to be ready
    document.addEventListener('DOMContentLoaded', function() {
      // Check if MANGA data exists
      if (typeof MANGA === 'undefined') {
        console.error('MANGA data not found. Make sure manga-data.js is loaded.');
        document.getElementById('main').innerHTML = '<div style="padding:80px 40px;color:#444;">ERROR: Manga data not loaded</div>';
        return;
      }

      const sidebar = document.getElementById('sidebar');
      const main = document.getElementById('main');
      const backTop = document.getElementById('back-top');
      const jumpInput = document.getElementById('jump-input');
      const jumpButton = document.getElementById('jump-button');
      const headerHeight = 56;

      // Clear and rebuild everything
      function build() {
        sidebar.innerHTML = '';
        main.innerHTML = '';

        if (!MANGA.length) {
          main.innerHTML = `<div style="padding:80px 40px;color:#444;font-family:'Bebas Neue',cursive;letter-spacing:3px">NO CHAPTERS YET</div>`;
          return;
        }

        // Sidebar header
        const lbl = document.createElement('span');
        lbl.className = 'sidebar-label';
        lbl.textContent = 'CHAPTERS';
        sidebar.appendChild(lbl);

        // Loop through chapters
        MANGA.forEach((ch, idx) => {
          const chapterNum = idx + 1;

          // Sidebar button
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'ch-link';
          btn.id = `sb-${chapterNum}`;
          btn.innerHTML = `Chapter ${chapterNum}<span class="ch-pages">${ch.pages.length}p</span>`;
          btn.onclick = () => gotoChapter(chapterNum);
          sidebar.appendChild(btn);

          // Chapter block
          const block = document.createElement('div');
          block.className = 'ch-block';
          block.id = `ch-${chapterNum}`;

          // Chapter header
          block.innerHTML = `
            <div class="ch-header">
              <span class="ch-badge">CH. ${String(chapterNum).padStart(2,'0')}</span>
              <span class="ch-label">CHAPTER ${chapterNum}</span>
              <span class="ch-pg-count">${ch.pages.length} PAGES</span>
            </div>
          `;

          // Pages
          ch.pages.forEach((file, pageIdx) => {
            const pageNum = pageIdx + 1;
            const wrap = document.createElement('div');
            wrap.className = 'page-wrap';

            const img = document.createElement('img');
            // Set error handler BEFORE src
            img.onerror = function() {
              wrap.innerHTML = '';
              const placeholder = document.createElement('div');
              placeholder.className = 'page-placeholder';
              placeholder.innerHTML = `
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.2">
                  <rect x="3" y="3" width="18" height="18" rx="2"/>
                  <path d="M3 9l4-4 4 4 4-4 4 4"/>
                  <circle cx="8.5" cy="14" r="1.5"/>
                </svg>
                <span>PAGE ${pageNum} / ${ch.pages.length}</span>
              `;
              const pageLabel = document.createElement('div');
              pageLabel.className = 'page-num';
              pageLabel.textContent = `${pageNum} / ${ch.pages.length}`;
              wrap.appendChild(placeholder);
              wrap.appendChild(pageLabel);
            };
            img.src = PAGES_FOLDER + file;
            img.alt = `Ch${chapterNum} P${pageNum}`;
            img.loading = 'lazy';

            const label = document.createElement('div');
            label.className = 'page-num';
            label.textContent = `${pageNum} / ${ch.pages.length}`;

            wrap.appendChild(img);
            wrap.appendChild(label);
            block.appendChild(wrap);
          });

          main.appendChild(block);
        });

        setupActiveChapterObserver();
      }

      // Scroll to specific chapter
      function gotoChapter(num) {
        const el = document.getElementById(`ch-${num}`);
        if (!el) return;
        const y = el.getBoundingClientRect().top + window.scrollY - headerHeight;
        window.scrollTo({ top: y, behavior: 'smooth' });
      }

      // Jump to chapter from input
      function jumpChapter() {
        const val = parseInt(jumpInput.value, 10);
        if (isNaN(val) || val < 1) return;
        if (val > MANGA.length) {
          alert(`Only ${MANGA.length} chapter(s) available.`);
          return;
        }
        gotoChapter(val);
      }

      // Highlight active chapter in sidebar while scrolling
      function setupActiveChapterObserver() {
        if (window.activeChapterObserver) {
          window.activeChapterObserver.disconnect();
        }

        const observer = new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;

            const chapterNum = entry.target.id.split('-')[1];
            
            document.querySelectorAll('.ch-link').forEach(btn => {
              btn.classList.remove('active');
            });
            
            const activeBtn = document.getElementById(`sb-${chapterNum}`);
            if (activeBtn) activeBtn.classList.add('active');
          });
        }, {
          rootMargin: '-20% 0px -30% 0px',
          threshold: 0
        });

        document.querySelectorAll('.ch-block').forEach(block => observer.observe(block));
        window.activeChapterObserver = observer;
      }

      // Back to top button visibility
      function handleScroll() {
        backTop.classList.toggle('show', window.scrollY > 500);
      }

      // Initialize everything
      build();
      jumpButton.addEventListener('click', jumpChapter);
      jumpInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') jumpChapter();
      });
      window.addEventListener('scroll', handleScroll, { passive: true });
    });
  })();
</script>

</body>
</html>
